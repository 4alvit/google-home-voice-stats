blueprint:
  name: IGW energy report on Google Nest
  description: >-
    Fetch an authenticated IGW report when called and speak its text on a selected
    Nest speaker. Install rest_command.igw_energy_report using the renderer first.
    IGW owns measurements, freshness, and report wording. This adapter does not
    calculate energy statistics. Keep this dispatcher private; expose only the
    generated wrapper scripts to Google Assistant instead.
  domain: script
  homeassistant:
    min_version: "2024.8.0"
  input:
    tts_entity:
      name: Speech provider
      selector:
        entity:
          filter:
            domain: tts
    media_player:
      name: Google Nest speaker
      selector:
        entity:
          filter:
            domain: media_player
            integration: cast
    max_response_age:
      name: Maximum API response age
      description: Reject an old or cached API envelope even if its report says fresh.
      default: 30
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: seconds
          mode: box
    fallback_message:
      name: Connection or invalid response message
      default: "I cannot get a current energy report right now. Please try again."
      selector:
        text:

mode: queued
max: 10
max_exceeded: warning
trace:
  stored_traces: 0
fields:
  report_key:
    name: Report
    default: status
    selector:
      select:
        options:
          - battery
          - solar
          - solar_today
          - status
          - alarms
          - flow
variables:
  nest_player: !input media_player
  maximum_age: !input max_response_age
  fallback: !input fallback_message
sequence:
  - variables:
      selected_report: "{{ report_key | default('status') }}"
      igw_response: {}
  - action: rest_command.igw_energy_report
    response_variable: igw_response
    continue_on_error: true
  - variables:
      spoken_report: >-
        {%- set response = igw_response | default({}, true) -%}
        {%- set body = response.get('content') if response is mapping else none -%}
        {%- set reports = body.get('reports') if body is mapping else none -%}
        {%- set report = reports.get(selected_report) if reports is mapping and selected_report is string else none -%}
        {%- if selected_report == 'flow' and reports is mapping and 'flow' not in reports -%}
          {%- set report = {'status': 'unconfigured', 'text': 'Energy flow is not configured. Ask the gateway administrator to configure flow measurements.'} -%}
        {%- endif -%}
        {%- set generated = body.get('generated_at') if body is mapping else none -%}
        {%- set metrics = body.get('metrics') if body is mapping else none -%}
        {%- if response is mapping
          and response.get('status') == 200
          and body is mapping
          and body.get('schema_version') is integer
          and body.get('schema_version') == 1
          and body.get('mqtt_connected') is boolean
          and generated is number and generated is not boolean
          and -5 <= as_timestamp(now()) - generated <= maximum_age | float
          and metrics is mapping
          and 'battery_soc' in metrics and 'solar_power' in metrics and 'solar_today' in metrics
          and selected_report in ['battery', 'solar', 'solar_today', 'status', 'alarms', 'flow']
          and report is mapping
          and report.get('status') in ['fresh', 'stale', 'unavailable', 'unconfigured']
          and (report.get('status') != 'fresh' or body.get('mqtt_connected') == true)
          and report.get('text') is string
          and 0 < report.get('text') | trim | length <= 1200 -%}
          {%- set brief = report.get('brief_text') -%}
          {%- if selected_report == 'status' and brief is string and 0 < brief | trim | length <= 1200 -%}
            {{- brief | trim -}}
          {%- else -%}
            {{- report.get('text') | trim -}}
          {%- endif -%}
        {%- else -%}
          {{- fallback -}}
        {%- endif -%}
  - action: tts.speak
    target:
      entity_id: !input tts_entity
    data:
      media_player_entity_id: !input media_player
      message: "{{ spoken_report }}"
      cache: false
  - wait_template: "{{ is_state(nest_player, 'playing') }}"
    timeout: "00:00:05"
    continue_on_timeout: true
  - wait_template: "{{ not is_state(nest_player, 'playing') }}"
    timeout: "00:01:30"
    continue_on_timeout: true
