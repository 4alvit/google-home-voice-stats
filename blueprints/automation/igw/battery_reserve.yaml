blueprint:
  name: Home Energy battery reserve notifications
  description: >-
    Notify once below a reserve and once after recovery. Uses an explicitly
    selected, freshness-qualified percentage sensor and a persistent helper.
    Notifications are limited to the selected daily window. No equipment is controlled.
  domain: automation
  input:
    battery_sensor:
      name: Battery charge sensor
      description: Select the authoritative battery percentage, not voltage or an estimate.
      selector:
        entity:
          domain: sensor
    freshness_sensor:
      name: Battery data freshness
      description: Must be on only when the selected battery reading is valid and current.
      selector:
        entity:
          domain: binary_sensor
    episode_helper:
      name: Reserve notification latch
      description: A dedicated input_boolean. Leave its initial value unset so HA restores it.
      selector:
        entity:
          domain: input_boolean
    reserve_percent:
      name: Notify below
      default: 20
      selector:
        number:
          min: 0
          max: 99
          unit_of_measurement: "%"
          mode: box
    recovery_percent:
      name: Notify recovery above
      description: Must be greater than the reserve threshold to prevent repeated alerts.
      default: 25
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: box
    stable_minutes:
      name: Threshold must persist for
      default: 2
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
          mode: box
    window_start:
      name: Notifications allowed from
      default: "08:00:00"
      selector:
        time: {}
    window_end:
      name: Notifications allowed until
      default: "22:00:00"
      selector:
        time: {}
    notification_service:
      name: Notification service
      description: Select persistent_notification.create or an existing notify service that accepts title and message, such as notify.mobile_app_your_phone.
      default: persistent_notification.create
      selector:
        text: {}

mode: single
max_exceeded: silent
trace:
  stored_traces: 0
trigger_variables:
  battery_entity: !input battery_sensor
  fresh_entity: !input freshness_sensor
  reserve: !input reserve_percent
  recovery: !input recovery_percent
variables:
  battery_entity: !input battery_sensor
  fresh_entity: !input freshness_sensor
  latch_entity: !input episode_helper
  reserve: !input reserve_percent
  recovery: !input recovery_percent
  notification_service: !input notification_service
triggers:
  - trigger: template
    value_template: >-
      {% set value = states(battery_entity) | float(none) %}
      {{ recovery > reserve and is_state(fresh_entity, 'on')
         and value is not none and 0 <= value <= 100 and value < reserve }}
    for:
      minutes: !input stable_minutes
  - trigger: template
    value_template: >-
      {% set value = states(battery_entity) | float(none) %}
      {{ recovery > reserve and is_state(fresh_entity, 'on')
         and value is not none and 0 <= value <= 100 and value > recovery }}
    for:
      minutes: !input stable_minutes
  - trigger: time
    at: !input window_start
conditions:
  - condition: time
    after: !input window_start
    before: !input window_end
  - condition: template
    value_template: >-
      {% set value = states(battery_entity) | float(none) %}
      {{ recovery > reserve and is_state(fresh_entity, 'on')
         and value is not none and 0 <= value <= 100
         and notification_service is string and notification_service | trim == notification_service
         and notification_service is match('^(persistent_notification[.]create|notify[.][a-z0-9_]+)$')
         and states(latch_entity) in ['on', 'off'] }}
actions:
  - choose:
      - conditions: "{{ states(battery_entity) | float(101) < reserve and is_state(latch_entity, 'off') }}"
        sequence:
          - variables:
              energy_notification_message: "Battery charge is below the configured reserve ({{ reserve }} percent)."
          - action: "{{ notification_service }}"
            data:
              title: Home Energy
              message: "{{ energy_notification_message }}"
          - action: input_boolean.turn_on
            target:
              entity_id: !input episode_helper
      - conditions: "{{ states(battery_entity) | float(-1) > recovery and is_state(latch_entity, 'on') }}"
        sequence:
          - variables:
              energy_notification_message: "Battery charge has recovered above {{ recovery }} percent."
          - action: "{{ notification_service }}"
            data:
              title: Home Energy
              message: "{{ energy_notification_message }}"
          - action: input_boolean.turn_off
            target:
              entity_id: !input episode_helper
