template:
  - sensor:
      - name: "Battery percent"
        unique_id: gvoice_battery_percent
        unit_of_measurement: "%"
        state: "{{ states('sensor.YOUR_BATTERY_SOC') | float(0) | round(0) }}"

      - name: "Solar energy today"
        unique_id: gvoice_solar_today_kwh
        unit_of_measurement: "kWh"
        state: "{{ states('sensor.YOUR_SOLAR_TODAY_KWH') | float(0) | round(2) }}"
