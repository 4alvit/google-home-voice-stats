version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # Piper's pinned ONNX Runtime has no Python 3.15 wheels yet.
    # Keep receiving 3.14 security/digest updates; lift after both Cast image variants pass.
    ignore:
      - dependency-name: python
        versions: [">=3.15"]
  # Renovate owns CI updates. The ignore rule also prevents separate
  # Dependabot security-update PRs; vulnerability alerts remain enabled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
