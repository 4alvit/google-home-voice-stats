version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # Piper's pinned ONNX Runtime has no Python 3.15 wheels yet.
    # Keep receiving 3.14 security/digest updates; lift after both Cast image variants pass.
    ignore:
      - dependency-name: python
        versions: [">=3.15"]
