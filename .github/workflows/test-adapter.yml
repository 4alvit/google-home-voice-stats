name: Test Google voice adapter

on:
  workflow_call: {}
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          python3 -m pip install '.[test,cast]'
      - name: Test response handling and rendered HA configuration
        run: bash scripts/ci.sh unit
      - name: Validate with Home Assistant 2026.9.2
        run: bash scripts/ci.sh config
