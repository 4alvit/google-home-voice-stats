name: Test Google voice adapter

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-build.txt -r requirements-test.lock -r requirements-tls.lock
          python3 -m pip install --no-deps --no-build-isolation '.[test,cast]'
      - name: Test response handling and rendered HA configuration
        run: bash scripts/ci.sh unit
      - name: Validate with Home Assistant 2026.9.2
        run: bash scripts/ci.sh config
  container:
    name: Locked Cast image (Piper ${{ matrix.piper }})
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        piper: ['false', 'true']
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check the locked runtime without contacting devices
        env:
          INSTALL_PIPER: ${{ matrix.piper }}
        run: |
          docker build -f Dockerfile.cast --build-arg "CAST_INSTALL_PIPER=$INSTALL_PIPER" --tag igw-cast-check .
          docker run --rm --entrypoint python igw-cast-check -m pip check
          docker run --rm --entrypoint python igw-cast-check -c 'import pychromecast, PIL, igw_google_voice.cast_service'
          if [ "$INSTALL_PIPER" = true ]; then
            docker run --rm --entrypoint python igw-cast-check -c 'import piper'
          fi
  kitten:
    name: Offline Nano inference
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned model and synthesize without network access
        run: |
          docker build -f Dockerfile.kitten -t igw-kitten-check .
          docker run --rm --network none --memory 768m --cpus 1 \
            --read-only --tmpfs /tmp:size=64m,exec --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$PWD/tests/smoke_kitten.py:/app/smoke_kitten.py:ro" \
            igw-kitten-check python /app/smoke_kitten.py

  russian:
    name: Offline Russian Piper inference
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned Russian voices and synthesize both offline
        run: |
          docker build -f Dockerfile.russian-speech -t igw-russian-check .
          for voice in piper-ru-denis piper-ru-irina; do
            docker run --rm --network none --memory 1g --cpus 2 \
              --read-only --tmpfs /tmp:size=64m,exec --cap-drop ALL \
              --security-opt no-new-privileges \
              -e "RUSSIAN_SPEECH_VOICE=$voice" \
              -v "$PWD/tests/smoke_russian_speech.py:/app/smoke_russian_speech.py:ro" \
              igw-russian-check python /app/smoke_russian_speech.py
          done
      - name: Build Baya and verify offline authenticated speech
        run: |
          docker build -f Dockerfile.russian-silero -t igw-baya-check .
          docker run --rm --network none --memory 1g --cpus 2 \
            --read-only --tmpfs /tmp:size=64m,exec --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$PWD/tests/smoke_russian_speech.py:/app/smoke_russian_speech.py:ro" \
            igw-baya-check python /app/smoke_russian_speech.py
