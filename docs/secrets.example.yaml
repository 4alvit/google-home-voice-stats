# Merge these keys into Home Assistant's existing secrets.yaml; do not overwrite it.
# Keep the real file outside version control and restrict permissions to its owner.
igw_energy_url: "https://REPLACE_WITH_IGW_HOST/v1/energy"
igw_energy_authorization: "Bearer REPLACE_WITH_SCOPED_READ_TOKEN"
# Only required when rendering with --cloudflare-access.
igw_cf_access_client_id: "REPLACE_WITH_CF_ACCESS_CLIENT_ID"
igw_cf_access_client_secret: "REPLACE_WITH_CF_ACCESS_CLIENT_SECRET"
